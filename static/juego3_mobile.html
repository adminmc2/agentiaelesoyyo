<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Descubre al agente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500;600;700;800;900&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            font-family: 'Source Sans 3', -apple-system, sans-serif;
            background: #E8F2F3;
            color: #2c2c2c;
            min-height: 100vh;
            min-height: 100dvh;
            overscroll-behavior: none;
        }
        .app {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Header mostaza */
        .hdr {
            background: #C9A632;
            color: #2c2c2c;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 2px 10px rgba(138, 106, 28, 0.3);
        }
        .hdr__title {
            font: 900 16px 'Dosis', sans-serif;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin: 0;
        }
        .hdr__progress {
            font: 900 13px 'Source Sans 3', sans-serif;
            background: #FFE7C1;
            padding: 4px 12px;
            border-radius: 999px;
            letter-spacing: 0.1em;
        }

        /* Main area */
        .main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Panel idle / ended — mensaje simple */
        .panel {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 6px 20px rgba(74, 45, 75, 0.08);
            text-align: center;
            margin-top: 40px;
        }
        .panel h2 {
            font: 900 24px 'Dosis', sans-serif;
            color: #6B2F6D;
            margin: 0 0 12px;
        }
        .panel p {
            font: 500 16px/1.5 'Source Sans 3', sans-serif;
            color: #555;
            margin: 0;
        }
        .panel__icon {
            font-size: 48px;
            color: #6B2F6D;
            margin-bottom: 8px;
            display: block;
        }

        /* Pregunta (voting y revealed) */
        .question {
            font: 900 26px/1.2 'Dosis', sans-serif;
            color: #2c2c2c;
            margin: 0 0 4px;
            letter-spacing: 0.01em;
        }

        /* Opciones (botones táctiles) */
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 16px 18px;
            background: #FFFFFF;
            border: 2px solid rgba(107, 47, 109, 0.12);
            border-radius: 18px;
            cursor: pointer;
            font: 500 18px/1.4 'Source Sans 3', sans-serif;
            color: #2c2c2c;
            text-align: left;
            transition: transform 0.12s ease, border-color 0.2s ease, background 0.2s ease;
            box-shadow: 0 3px 10px rgba(74, 45, 75, 0.06);
            min-height: 80px;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .option:active { transform: scale(0.98); }
        .option:disabled { cursor: default; }
        .option__letter {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            background: #D0AAD1;
            color: #2c2c2c;
            font: 900 18px/40px 'Dosis', sans-serif;
            text-align: center;
            flex-shrink: 0;
            border: 2px solid #FFFFFF;
            box-shadow: 0 2px 6px rgba(208, 170, 209, 0.5);
        }
        .option__body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }
        .option__icon {
            font-size: 22px;
            color: #6B2F6D;
        }
        .option__text { margin: 0; }

        /* Estado seleccionado (voto registrado, aún en voting) */
        .option--selected {
            border-color: #6B2F6D;
            background: rgba(208, 170, 209, 0.22);
        }
        .option--selected .option__letter { background: #6B2F6D; color: #FFFFFF; }

        /* Estado revelado — correcta en verde, resto tenues */
        .option--correct {
            border-color: #8CBEB2;
            background: rgba(140, 190, 178, 0.18);
        }
        .option--correct .option__letter { background: #8CBEB2; color: #FFFFFF; }
        .option--wrong {
            opacity: 0.55;
        }

        /* Banner de feedback (correcto / incorrecto / neutro) */
        .banner {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 22px 20px;
            border-radius: 20px;
            font-family: 'Dosis', sans-serif;
        }
        .banner__icon {
            font-size: 44px;
            flex-shrink: 0;
            line-height: 1;
            margin-top: -2px;
        }
        .banner__body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }
        .banner__title {
            font: 900 22px 'Dosis', sans-serif;
            margin: 0;
            line-height: 1.15;
        }
        .banner__hint {
            font: 600 16px 'Source Sans 3', sans-serif;
            margin: 0;
            opacity: 0.9;
        }
        .banner--correct {
            background: rgba(140, 190, 178, 0.22);
            border: 2px solid #8CBEB2;
            color: #2A5F52;
        }
        .banner--wrong {
            background: rgba(212, 130, 106, 0.18);
            border: 2px solid #D4826A;
            color: #7A3A22;
        }
        .banner--neutral {
            background: rgba(107, 47, 109, 0.08);
            border: 2px solid rgba(107, 47, 109, 0.25);
            color: #4A2D4B;
        }

        /* Banner "voto registrado" (durante voting tras votar) */
        .waiting {
            background: rgba(107, 47, 109, 0.1);
            border: 2px solid rgba(107, 47, 109, 0.25);
            color: #4A2D4B;
            padding: 16px 18px;
            border-radius: 16px;
            text-align: center;
            font: 700 16px 'Source Sans 3', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .waiting i { font-size: 22px; }

        /* Explicaciones compactas (post-reveal) */
        .explain {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 6px 20px rgba(74, 45, 75, 0.08);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .explain__item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .explain__tag {
            font: 800 11px 'Source Sans 3', sans-serif;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }
        .explain__tag--chatbot { color: #A87B3C; }
        .explain__tag--asistente { color: #4A8C8E; }
        .explain__tag--agente { color: #6B2F6D; }
        .explain__text {
            font: 500 16px/1.4 'Source Sans 3', sans-serif;
            color: #2c2c2c;
            margin: 0;
        }

        /* Footer */
        .ver {
            text-align: center;
            font: 500 10px 'Source Sans 3', sans-serif;
            color: #aaa;
            padding: 12px;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <header class="hdr">
            <h1 class="hdr__title">Descubre al agente</h1>
            <span class="hdr__progress" id="progress">— / 5</span>
        </header>

        <main class="main" id="content"></main>

        <p class="ver">v23.13.7</p>
    </div>

    <script>
        const WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws/juego3`;

        // ─── Participant ID: UUID v4 con fallback de 3 niveles ───
        //   1. localStorage (persistente entre sesiones — ideal)
        //   2. sessionStorage (persiste solo mientras la pestaña está abierta)
        //   3. en memoria (dura hasta recargar — peor caso)
        //   4. si todo falla → string vacío → backend rechaza + aviso al usuario
        function genUUIDv4() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        const STORAGE_KEY = 'juego3_participant_id';
        let _inMemoryPid = null;   // fallback de último recurso
        let _storageLevel = 'none'; // para diagnosticar en consola

        function getOrCreateParticipantId() {
            // Nivel 1: localStorage
            try {
                let pid = localStorage.getItem(STORAGE_KEY);
                if (!pid) {
                    pid = genUUIDv4();
                    localStorage.setItem(STORAGE_KEY, pid);
                }
                _storageLevel = 'localStorage';
                return pid;
            } catch (_) { /* fallthrough */ }

            // Nivel 2: sessionStorage
            try {
                let pid = sessionStorage.getItem(STORAGE_KEY);
                if (!pid) {
                    pid = genUUIDv4();
                    sessionStorage.setItem(STORAGE_KEY, pid);
                }
                _storageLevel = 'sessionStorage';
                return pid;
            } catch (_) { /* fallthrough */ }

            // Nivel 3: memoria
            if (!_inMemoryPid) {
                _inMemoryPid = genUUIDv4();
                _storageLevel = 'memory';
            }
            return _inMemoryPid;
        }

        const PARTICIPANT_ID = getOrCreateParticipantId();
        console.log('[juego3] participant_id storage level:', _storageLevel);

        const state = {
            cards: null,
            currentCard: -1,
            phase: 'idle',
            total: 5,
            cardTotalVotos: null,       // en revealed: 0 si nadie votó, >0 si alguien votó
            selected: null,             // letra votada esta carta (lo que ESTE jugador eligió)
            votedCards: {},             // {cardIdx: letter} — caché local de votos
            ws: null,
            retryMs: 1500,
            rejectedMsg: null,          // mensaje del backend si el voto fue rechazado (one-shot)
            participantBlocked: false,  // true si el backend rechazó el participant_id en hello
            participantBlockedMsg: '',  // mensaje persistente del rechazo
        };

        // Persistir votos en localStorage para sobrevivir recarga
        const VOTES_KEY = 'juego3_votes';
        function loadLocalVotes() {
            try {
                const raw = localStorage.getItem(VOTES_KEY);
                if (raw) state.votedCards = JSON.parse(raw) || {};
            } catch (_) { state.votedCards = {}; }
        }
        function saveLocalVotes() {
            try { localStorage.setItem(VOTES_KEY, JSON.stringify(state.votedCards)); } catch (_) {}
        }

        async function loadCards() {
            try {
                const res = await fetch('/api/juego3/cards');
                const data = await res.json();
                state.cards = data.cards;
                state.total = data.total || state.total;
            } catch (e) {
                console.error('Error cargando cartas:', e);
            }
        }

        function sendHello() {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({ type: 'hello', participant: PARTICIPANT_ID }));
            }
        }

        function connect() {
            state.ws = new WebSocket(WS_URL);
            state.ws.onopen = () => {
                state.retryMs = 1500;
                sendHello();
            };
            state.ws.onmessage = (ev) => {
                try {
                    const msg = JSON.parse(ev.data);
                    if (msg.type === 'state') {
                        state.currentCard = msg.current_card;
                        state.phase = msg.phase;
                        state.total = msg.total || state.total;
                        state.cardTotalVotos = (msg.card_total_votos != null) ? msg.card_total_votos : null;
                        state.selected = state.votedCards[state.currentCard] || null;
                        render();
                    } else if (msg.type === 'vote_rejected') {
                        // Backend rechazó el voto (participant_id vacío o inválido).
                        // Revertir el voto local y avisar al usuario.
                        console.warn('[juego3] vote rejected by server:', msg.reason, msg.message);
                        if (state.currentCard != null && state.votedCards[state.currentCard]) {
                            delete state.votedCards[state.currentCard];
                            saveLocalVotes();
                        }
                        state.selected = null;
                        state.rejectedMsg = msg.message || 'Tu voto no se pudo registrar.';
                        render();
                    } else if (msg.type === 'participant_rejected') {
                        // Backend rechazó el hello (pid inválido o ausente).
                        // Mostramos aviso persistente para que el usuario actúe ANTES de votar.
                        console.warn('[juego3] participant rejected by server:', msg.reason, msg.message);
                        state.participantBlocked = true;
                        state.participantBlockedMsg = msg.message || 'Tu identidad no es válida. Recarga la página.';
                        render();
                    }
                    // tally/summary se ignoran en móvil (son para dashboard)
                } catch (e) { /* ignore */ }
            };
            state.ws.onclose = () => {
                setTimeout(() => { state.retryMs = Math.min(state.retryMs * 1.5, 10000); connect(); }, state.retryMs);
            };
            state.ws.onerror = () => { try { state.ws.close(); } catch (_) {} };
        }

        function vote(letter) {
            if (state.phase !== 'voting') return;
            if (state.votedCards[state.currentCard]) return; // ya votó esta carta
            state.votedCards[state.currentCard] = letter;
            state.selected = letter;
            saveLocalVotes();
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({
                    type: 'vote',
                    card: state.currentCard,
                    letter: letter,
                    participant: PARTICIPANT_ID
                }));
            }
            render();
        }

        // ─── Helpers ───
        function tipoLabel(tipo) {
            const map = { chatbot: 'CHATBOT', asistente: 'ASISTENTE', agente: 'AGENTE' };
            return map[tipo] || tipo.toUpperCase();
        }
        function letraToTipo(card, letra) {
            const op = card.opciones.find(o => o.letra === letra);
            return op ? op.tipo : null;
        }
        function explicacionDe(card, tipo) {
            if (!tipo || !card.explicaciones) return '';
            return card.explicaciones[tipo] || '';
        }

        // ─── Render ───
        function render() {
            const content = document.getElementById('content');
            const progress = document.getElementById('progress');

            if (state.phase === 'idle' || state.currentCard < 0) {
                progress.textContent = `— / ${state.total}`;
                content.innerHTML = `
                    <div class="panel">
                        <i class="ph-fill ph-hourglass panel__icon"></i>
                        <h2>El juego empezará en breve</h2>
                        <p>Mira al proyector. Cuando aparezca la primera carta, toca aquí la opción que creas que es un agente.</p>
                    </div>
                `;
                return;
            }

            if (state.phase === 'ended') {
                progress.textContent = `${state.total} / ${state.total}`;
                content.innerHTML = `
                    <div class="panel">
                        <i class="ph-fill ph-confetti panel__icon"></i>
                        <h2>¡Juego terminado!</h2>
                        <p>Eliana va a comentar los resultados en la pantalla grande. Mira al proyector.</p>
                    </div>
                `;
                return;
            }

            const card = state.cards && state.cards[state.currentCard];
            if (!card) {
                content.innerHTML = `<div class="panel"><h2>Cargando carta…</h2></div>`;
                return;
            }

            progress.textContent = `${state.currentCard + 1} / ${state.total}`;

            const isRevealed = state.phase === 'revealed';
            const votedLetter = state.selected; // lo que eligió este jugador
            const correctLetter = card.correcta;
            const correctTipo = letraToTipo(card, correctLetter);
            const votedTipo = votedLetter ? letraToTipo(card, votedLetter) : null;
            const acerto = isRevealed && votedLetter && votedLetter === correctLetter;
            const fallo = isRevealed && votedLetter && votedLetter !== correctLetter;
            const noVoto = isRevealed && !votedLetter;

            const optionsHTML = card.opciones.map(op => {
                let cls = 'option';
                if (isRevealed) {
                    if (op.letra === correctLetter) cls += ' option--correct';
                    else cls += ' option--wrong';
                } else if (state.selected === op.letra) {
                    cls += ' option--selected';
                }
                const clickable = (state.phase === 'voting' && !state.selected);
                return `
                    <button class="${cls}" data-letter="${op.letra}" ${clickable ? '' : 'disabled'}>
                        <span class="option__letter">${op.letra}</span>
                        <span class="option__body">
                            <i class="ph-fill ${op.icono} option__icon"></i>
                            <span class="option__text">${op.texto}</span>
                        </span>
                    </button>
                `;
            }).join('');

            let bannerHTML = '';
            let explainHTML = '';

            if (state.phase === 'voting' && state.selected) {
                bannerHTML = `
                    <div class="waiting">
                        <i class="ph-fill ph-check-circle"></i>
                        Voto registrado — esperando al resto
                    </div>
                `;
            } else if (acerto) {
                bannerHTML = `
                    <div class="banner banner--correct" role="status">
                        <i class="ph-fill ph-check-circle banner__icon"></i>
                        <div class="banner__body">
                            <p class="banner__title">¡Correcto!</p>
                            <p class="banner__hint">Tu opción (${votedLetter}) era la del agente.</p>
                        </div>
                    </div>
                `;
                // Solo explicación del correcto
                explainHTML = `
                    <div class="explain">
                        <div class="explain__item">
                            <span class="explain__tag explain__tag--${correctTipo}">${tipoLabel(correctTipo)}</span>
                            <p class="explain__text">${explicacionDe(card, correctTipo)}</p>
                        </div>
                    </div>
                `;
            } else if (fallo) {
                bannerHTML = `
                    <div class="banner banner--wrong" role="status">
                        <i class="ph-fill ph-x-circle banner__icon"></i>
                        <div class="banner__body">
                            <p class="banner__title">No era esa</p>
                            <p class="banner__hint">Confundiste <strong>${tipoLabel(votedTipo).toLowerCase()}</strong> con <strong>agente</strong>. La correcta era (${correctLetter}).</p>
                        </div>
                    </div>
                `;
                // 2 explicaciones: lo elegido + lo correcto
                explainHTML = `
                    <div class="explain">
                        <div class="explain__item">
                            <span class="explain__tag explain__tag--${votedTipo}">${tipoLabel(votedTipo)} (tu elección)</span>
                            <p class="explain__text">${explicacionDe(card, votedTipo)}</p>
                        </div>
                        <div class="explain__item">
                            <span class="explain__tag explain__tag--${correctTipo}">${tipoLabel(correctTipo)} (correcta)</span>
                            <p class="explain__text">${explicacionDe(card, correctTipo)}</p>
                        </div>
                    </div>
                `;
            } else if (noVoto) {
                // Distinguir "nadie votó" (total=0) vs "yo solo no voté" (total>0)
                const nadieVoto = (state.cardTotalVotos === 0);
                const title = nadieVoto ? 'Nadie respondió esta vez' : 'No votaste esta vez';
                const hint = `La correcta era (${correctLetter}) — un ${tipoLabel(correctTipo).toLowerCase()}.`;
                bannerHTML = `
                    <div class="banner banner--neutral" role="status">
                        <i class="ph-fill ph-info banner__icon"></i>
                        <div class="banner__body">
                            <p class="banner__title">${title}</p>
                            <p class="banner__hint">${hint}</p>
                        </div>
                    </div>
                `;
                explainHTML = `
                    <div class="explain">
                        <div class="explain__item">
                            <span class="explain__tag explain__tag--${correctTipo}">${tipoLabel(correctTipo)}</span>
                            <p class="explain__text">${explicacionDe(card, correctTipo)}</p>
                        </div>
                    </div>
                `;
            }

            // Aviso persistente: backend rechazó la identidad del participante.
            // Mostrado ARRIBA del todo hasta que el usuario recargue (flag no se resetea).
            let blockedHTML = '';
            if (state.participantBlocked) {
                blockedHTML = `
                    <div class="banner banner--wrong" role="alert">
                        <i class="ph-fill ph-warning-circle banner__icon"></i>
                        <div class="banner__body">
                            <p class="banner__title">Identidad no válida</p>
                            <p class="banner__hint">${state.participantBlockedMsg}</p>
                        </div>
                    </div>
                `;
            }

            // Aviso de storage bloqueado (memoria = voto no sobrevive recarga)
            // o aviso de rechazo reciente del backend.
            let storageWarnHTML = '';
            if (!state.participantBlocked && (_storageLevel === 'memory' || _storageLevel === 'none')) {
                storageWarnHTML = `
                    <div class="banner banner--wrong" role="alert" style="border-width:1.5px">
                        <i class="ph-fill ph-warning banner__icon"></i>
                        <div class="banner__body">
                            <p class="banner__title">Almacenamiento limitado</p>
                            <p class="banner__hint">Tu voto podría no sobrevivir a una recarga. Activa cookies/almacenamiento del navegador si puedes.</p>
                        </div>
                    </div>
                `;
            }
            let rejectedHTML = '';
            if (state.rejectedMsg) {
                rejectedHTML = `
                    <div class="banner banner--wrong" role="alert">
                        <i class="ph-fill ph-x-circle banner__icon"></i>
                        <div class="banner__body">
                            <p class="banner__title">Voto no registrado</p>
                            <p class="banner__hint">${state.rejectedMsg}</p>
                        </div>
                    </div>
                `;
                // El mensaje se muestra una sola vez y se limpia
                state.rejectedMsg = null;
            }

            // Orden: aviso bloqueo (si aplica) → aviso storage → aviso rechazo → pregunta → opciones → banner fase → explicación
            content.innerHTML = `
                ${blockedHTML}
                ${storageWarnHTML}
                ${rejectedHTML}
                <h2 class="question">${card.pregunta}</h2>
                <div class="options">${optionsHTML}</div>
                ${bannerHTML}
                ${explainHTML}
            `;

            content.querySelectorAll('.option').forEach(btn => {
                btn.addEventListener('click', () => {
                    const letter = btn.dataset.letter;
                    vote(letter);
                });
            });
        }

        (async () => {
            loadLocalVotes();
            await loadCards();
            render();
            connect();
        })();
    </script>
</body>
</html>
